<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B5A78"/>
      <stop offset="1" stop-color="#1C2E40"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F6F8"/>
      <stop offset="0.55" stop-color="#C7D2DA"/>
      <stop offset="1" stop-color="#93A4B0"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#5C7A93"/>
      <stop offset="1" stop-color="#2C4256"/>
    </radialGradient>
    <filter id="innerShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feOffset dx="0" dy="10"/>
      <feGaussianBlur stdDeviation="14" result="off"/>
      <feComposite in="SourceGraphic" in2="off" operator="out" result="cut"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="cut" operator="in"/>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="226" ry="226"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

    <!-- soft vignette -->
    <rect x="0" y="0" width="1024" height="1024" fill="black" opacity="0.10"/>
  </g>

  <!-- gear body -->
  <path d="M 765.43,463.66 L 835.14,445.08 L 835.14,578.92 L 765.43,560.34 L 725.39,657.02 L 787.82,693.18 L 693.18,787.82 L 657.02,725.39 L 560.34,765.43 L 578.92,835.14 L 445.08,835.14 L 463.66,765.43 L 366.98,725.39 L 330.82,787.82 L 236.18,693.18 L 298.61,657.02 L 258.57,560.34 L 188.86,578.92 L 188.86,445.08 L 258.57,463.66 L 298.61,366.98 L 236.18,330.82 L 330.82,236.18 L 366.98,298.61 L 463.66,258.57 L 445.08,188.86 L 578.92,188.86 L 560.34,258.57 L 657.02,298.61 L 693.18,236.18 L 787.82,330.82 L 725.39,366.98 Z" fill="url(#metal)" stroke="#5C6C77" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- hub -->
  <circle cx="512.0" cy="512.0" r="165" fill="url(#hub)" stroke="#5C6C77" stroke-width="10"/>
  <circle cx="512.0" cy="512.0" r="100" fill="url(#bg)" stroke="#0F1B26" stroke-width="6"/>
</svg>